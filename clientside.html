<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Information Form | ZenoLaunch</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styeleui/clientside.css">
</head>
<body>
    <div class="theme-toggle-container">
        <div class="theme-toggle">
            <div class="toggle-switch">
                <i class="fas fa-sun sun-icon"></i>
                <i class="fas fa-moon moon-icon"></i>
            </div>
        </div>
    </div>
    
    <div class="container">
        <header>
            <a href="#" class="logo">
                    <div class="logo-icon">
                        <img src="img/logoone.png" alt="ZenoLaunch Logo">
                    </div>
                    <div class="logo-text">
                        <span class="zeno">Zeno</span><span class="launch">Launch</span>
                    </div>
                </a>
            <h1>Business Information Form</h1>
            <p>Help us understand your business needs to provide the best service</p>
        </header>
        
        <div class="form-container">
            <form id="businessForm">
                <!-- Company Information -->
                <div class="form-section">
                    <h2><i class="fas fa-building"></i> Company Information</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="companyName">Company Name <span class="required">*</span></label>
                            <input type="text" id="companyName" name="companyName" required placeholder="Enter your company name">
                        </div>
                        
                        <div class="form-group">
                            <label for="businessType">Business Type <span class="required">*</span></label>
                            <select id="businessType" name="businessType" required>
                                <option value="" disabled selected>Select business type</option>
                                <option value="sole">Sole Proprietorship</option>
                                <option value="partnership">Partnership</option>
                                <option value="llc">Limited Liability Company (LLC)</option>
                                <option value="corporation">Corporation</option>
                                <option value="nonprofit">Nonprofit Organization</option>
                                <option value="cooperative">Cooperative</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="address">Business Address <span class="required">*</span></label>
                            <input type="text" id="address" name="address" required placeholder="Full business address">
                        </div>
                        
                        <div class="form-group">
                            <label for="registered">Registered Business? <span class="required">*</span></label>
                            <div class="radio-group">
                                <div class="radio-option">
                                    <input type="radio" id="registered-yes" name="registered" value="yes" required>
                                    <label for="registered-yes">Yes</label>
                                </div>
                                <div class="radio-option">
                                    <input type="radio" id="registered-no" name="registered" value="no">
                                    <label for="registered-no">No</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Design & Branding -->
                <div class="form-section">
                    <h2><i class="fas fa-palette"></i> Design & Branding</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="designStyle">Design Preference</label>
                            <select id="designStyle" name="designStyle">
                                <option value="" disabled selected>Select preferred design style</option>
                                <option value="minimalist">Minimalist</option>
                                <option value="modern">Modern</option>
                                <option value="professional">Professional</option>
                                <option value="creative">Creative</option>
                                <option value="vibrant">Vibrant & Colorful</option>
                                <option value="elegant">Elegant</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="members">Number of Team Members</label>
                            <input type="number" id="members" name="members" min="1" placeholder="How many people in your team?">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="logo">Company Logo</label>
                        <div class="file-upload">
                            <label for="logoUpload">
                                <i class="fas fa-upload"></i> Upload Logo
                                <input type="file" id="logoUpload" name="logo" accept="image/*" style="display: none;">
                            </label>
                            <div class="file-preview" id="logoPreview">
                                <img id="previewImage" src="#" alt="Logo preview" style="display: none;">
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Hosting & Technical -->
                <div class="form-section">
                    <h2><i class="fas fa-server"></i> Hosting & Technical</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="hostingBudget">
                                Budget for Hosting 
                                <span class="input-hint">
                                    <i class="fas fa-info-circle"></i>
                                    <span class="tooltip">Web hosting is a service that allows organizations and individuals to post a website or web page onto the Internet.</span>
                                </span>
                            </label>
                            <input type="text" id="hostingBudget" name="hostingBudget" placeholder="Your hosting budget (e.g., R500/month)">
                        </div>
                    </div>
                </div>
                
                <!-- Additional Information -->
                <div class="form-section">
                    <h2><i class="fas fa-edit"></i> Additional Information</h2>
                    <div class="form-group">
                        <label for="preferences">Additional Preferences & Requirements</label>
                        <textarea id="preferences" name="preferences" placeholder="Any specific requirements or preferences for your project..."></textarea>
                    </div>
                </div>
                
                <!-- GDPR Consent -->
                <div class="gdpr-consent">
                    <input type="checkbox" id="gdpr" name="gdpr" required>
                    <label for="gdpr">I consent to ZenoLaunch collecting and storing my business information for service purposes. I understand that this information will be used solely to provide me with the requested services.</label>
                </div>
                
                <!-- Form Buttons -->
                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-paper-plane"></i> Submit Information
                    </button>
                    <button type="reset" class="btn btn-outline">
                        <i class="fas fa-redo"></i> Reset Form
                    </button>
                </div>
            </form>
        </div>
        
        <footer>
            <p>&copy; 2025 ZenoLaunch. All rights reserved. | Crafting digital excellence for your business</p>
        </footer>
    </div>
    
    <script src="javascript/clienctside.js"></script>
</body>
</html>
